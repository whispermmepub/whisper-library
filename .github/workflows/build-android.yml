name: Build Android APK

on:
  push:
    branches: [android-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0" "platforms;android-35"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -v 4 "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -20

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Whisper-Library-v1.0.1-Android11.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whisper-Library-Android11-APK
          path: Whisper-Library-v1.0.1-Android11.apk
          retention-days: 30
